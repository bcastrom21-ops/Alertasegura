<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlertaSegura Cartagena | Bayunca</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <h1>AlertaSegura Cartagena | Bayunca</h1>
    <div class="nav-tabs">
        <button id="tabVecino" class="active" onclick="cambiarVista('vecino')">Panel Vecino</button>
        <button id="tabAdmin" onclick="cambiarVista('admin')">Panel Administración</button>
    </div>
</header>

<div class="container">
    <!-- VISTA VECINO -->
    <div id="vistaVecino">
        <div class="card">
            <h2>Crear Reporte de Incidente</h2>
            <form id="formReporte">
                <input type="hidden" id="id_usuario" value="1">
                <label for="categoria">Categoría del incidente:</label>
                <select id="categoria" required>
                    <option value="">Seleccione una categoría...</option>
                    <option value="Actividad sospechosa">Actividad sospechosa</option>
                    <option value="Hurto / Robo">Hurto / Robo</option>
                    <option value="Alumbrado público dañado">Alumbrado público dañado</option>
                    <option value="Emergencia vial / Accidente">Emergencia vial / Accidente</option>
                </select>

                <label for="descripcion">Descripción de la situación (Regla de negocio: mínimo 10 caracteres):</label>
                <textarea id="descripcion" rows="3" required placeholder="Describa detalladamente lo que sucede..."></textarea>

                <label for="sector">Sector / Ubicación aproximada en Bayunca:</label>
                <input type="text" id="sector" required placeholder="Ej. Sector Las Palmeras, Calle Principal">

                <button type="submit" class="btn-primary">Enviar reporte</button>
            </form>
        </div>

        <div class="card">
            <h2>Consulta de Reportes Comunitarios</h2>
            <input type="text" id="buscador" placeholder="Filtrar por categoría o sector..." onkeyup="cargarReportes()">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Sector</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaVecino"></tbody>
            </table>
        </div>
    </div>

    <!-- VISTA ADMINISTRACIÓN -->
    <div id="vistaAdmin" class="hidden">
        <div class="card">
            <h2>Panel de Moderación y Administración</h2>
            <p style="font-size: 14px; color: #666;">Gestione el estado de los reportes enviados por los vecinos de Bayunca.</p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Sector</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaAdmin"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
